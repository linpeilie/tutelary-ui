syntax="proto3";
package cn.easii.tutelary.message.command.domain;
option java_outer_classname = "HostInfo$$ByJProtobuf";
//
message HostInfo {  
 string hostName=1;
 string hostAddress=2;
 string osName=3;
 string arch=4;
 string systemVersion=5;
 string cpuModel=6;
 int32 availableProcessors=7;
 string systemBootTime=8;
 int64 memorySize=9;
}
